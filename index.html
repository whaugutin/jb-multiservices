<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>JB Multiservices</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="https://i.postimg.cc/cCx0671R/JB-Multi-Services-Gold-Emblem.png">
<link rel="apple-touch-icon" href="https://i.postimg.cc/cCx0671R/JB-Multi-Services-Gold-Emblem.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#000000; --surface:#14110C; --surface-2:#1D1912; --surface-3:#262016;
  --line:#332C1E; --line-soft:#241F16;
  --gold:#C9A227; --gold-hi:#EBCB6A; --gold-lo:#8A6E18; --gold-wash:rgba(201,162,39,.10);
  --ivory:#F3EBD8; --muted:#A3977C; --faint:#6E654F;
  --ok:#74B57F; --warn:#E3A63B; --bad:#DD6452;
  --display:'Marcellus', 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --ui:'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --r-sm:8px; --r:12px; --r-lg:18px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--black);color:var(--ivory);font:15px/1.5 var(--ui);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold-hi)}
img{max-width:100%}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.01em;margin:0;color:var(--ivory)}
h1{font-size:28px;line-height:1.15}
h2{font-size:22px;line-height:1.2}
h3{font-size:17px;line-height:1.25}
.muted{color:var(--muted)} .faint{color:var(--faint)} .gold{color:var(--gold-hi)}
.ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.small{font-size:13px} .tiny{font-size:12px}
.right{text-align:right} .center{text-align:center}
.row{display:flex;gap:10px;align-items:center} .wrap{flex-wrap:wrap} .grow{flex:1;min-width:0}
.stack>*+*{margin-top:12px}
.hidden{display:none!important}
.nowrap{white-space:nowrap}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface-2);color:var(--ivory);font-weight:600;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--gold-lo)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#000}
.btn.primary:hover{background:var(--gold-hi);border-color:var(--gold-hi)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ivory);border-color:var(--line)}
.btn.danger{background:transparent;border-color:#5a2a22;color:var(--bad)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:var(--r-sm)}
.btn.block{width:100%}
.btn.xl{min-height:58px;font-size:17px}
.iconbtn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:var(--r);border:1px solid transparent;background:transparent;color:var(--ivory);cursor:pointer}
.iconbtn:hover{border-color:var(--line)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Formulaires ---------- */
label.f{display:block}
label.f>span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.input,select.input,textarea.input{width:100%;min-height:46px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--ivory);outline:none}
textarea.input{min-height:84px;resize:vertical}
.input:focus{border-color:var(--gold)}
.input::placeholder{color:var(--faint)}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--gold);margin:2px 0 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px}
.seg button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:600;cursor:pointer}
.seg button.on{background:var(--gold);color:#000}
.formerr{color:var(--bad);font-size:14px;min-height:0}

/* ---------- Barre supérieure ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft);padding-top:var(--safe-t)}
.top-in{display:flex;align-items:center;gap:12px;height:62px;padding:0 14px;max-width:1280px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ivory);min-width:0}
.brand img{width:38px;height:38px;object-fit:contain}
.brand b{font-family:var(--display);font-weight:400;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--muted);background:var(--surface);cursor:pointer;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.pill.off .dot{background:var(--warn)}
.pill.err .dot{background:var(--bad)}
.pill.busy .dot{background:var(--gold);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

/* ---------- Mise en page ---------- */
main{max-width:1280px;margin:0 auto;padding:18px 14px calc(110px + var(--safe-b))}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);padding:18px}
.card.flat{background:transparent}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ivory);margin-bottom:6px}
.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r);border:1px solid #5b4413;background:rgba(227,166,59,.08);color:var(--ivory);font-size:14px}
.banner.bad{border-color:#5a2a22;background:rgba(221,100,82,.08)}

/* ---------- Connexion ---------- */
.login{min-height:100%;display:grid;place-items:center;padding:calc(30px + var(--safe-t)) 18px calc(30px + var(--safe-b));background:radial-gradient(ellipse at 50% 18%, rgba(201,162,39,.16), transparent 55%), var(--black)}
.login-box{width:100%;max-width:380px;text-align:center}
.login-box img.emb{width:150px;height:150px;object-fit:contain;margin-bottom:6px}
.login-box h1{font-size:30px;margin-bottom:4px}
.login-box form{text-align:left;margin-top:26px}

/* ---------- Choix du service ---------- */
.hello{margin:6px 2px 18px}
.hello h1{font-size:30px}
.services{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.svc{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:10px;aspect-ratio:1/1.08;padding:14px 10px 16px;border-radius:var(--r-lg);border:1px solid var(--line);background:radial-gradient(circle at 50% 38%, rgba(201,162,39,.14), transparent 62%), var(--surface);cursor:pointer;text-align:center;color:var(--ivory);transition:border-color .2s, transform .2s}
.svc:hover,.svc:focus-visible{border-color:var(--gold)}
.svc:active{transform:scale(.98)}
.svc .lg{flex:1;width:100%;display:grid;place-items:center;min-height:0}
.svc .lg img{max-width:82%;max-height:100%;object-fit:contain}
.svc .lg svg{width:58%;height:58%;stroke:var(--gold);stroke-width:1.2;fill:none}
.svc b{font-family:var(--display);font-weight:400;font-size:18px;line-height:1.2}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:22px}
.qa{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line-soft);background:var(--surface);color:var(--ivory);cursor:pointer;text-align:left}
.qa:hover{border-color:var(--gold-lo)}
.qa svg{color:var(--gold)}
.qa small{display:block;color:var(--muted);font-size:12px}

/* ---------- Point de vente ---------- */
.pos{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}
@media (max-width:900px){.pos{grid-template-columns:1fr}}
.pos-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.pos-head img{width:48px;height:48px;object-fit:contain}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer}
.chip.on{border-color:var(--gold);color:var(--gold-hi);background:var(--gold-wash)}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.prod{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:104px;padding:12px;border-radius:var(--r);border:1px solid var(--line-soft);background:var(--surface);text-align:left;cursor:pointer;color:var(--ivory)}
.prod:hover{border-color:var(--gold-lo)}
.prod:active{background:var(--surface-2)}
.prod .nm{font-weight:600;line-height:1.3}
.prod .pr{font-family:var(--display);font-size:18px;color:var(--gold-hi)}
.prod .st{font-size:12px;color:var(--muted)}
.prod .st.low{color:var(--warn)} .prod .st.out{color:var(--bad)}
.prod .qbadge{position:absolute;top:8px;right:8px;min-width:24px;height:24px;padding:0 6px;border-radius:999px;background:var(--gold);color:#000;font-weight:700;font-size:13px;display:grid;place-items:center}
.prod[disabled]{opacity:.45;cursor:not-allowed}

.cart{position:sticky;top:80px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);display:flex;flex-direction:column;max-height:calc(100vh - 100px)}
.cart-h{padding:16px 16px 10px;display:flex;justify-content:space-between;align-items:center}
.cart-l{overflow:auto;padding:0 8px;flex:1}
.cline{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 8px;border-top:1px solid var(--line-soft)}
.cline .nm{font-weight:600}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{width:36px;height:34px;border:0;background:transparent;color:var(--ivory);font-size:18px;cursor:pointer}
.qty input{width:52px;height:34px;border:0;background:transparent;text-align:center;color:var(--ivory)}
.cart-f{padding:14px 16px 16px;border-top:1px solid var(--line)}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.total b{font-family:var(--display);font-weight:400;font-size:30px;color:var(--gold-hi)}
@media (max-width:900px){
  .cart{position:fixed;left:0;right:0;bottom:0;top:auto;border-radius:var(--r-lg) var(--r-lg) 0 0;max-height:72vh;z-index:30;padding-bottom:var(--safe-b);border-bottom:0;transform:translateY(calc(100% - 84px - var(--safe-b)));transition:transform .25s;box-shadow:0 -12px 30px rgba(0,0,0,.6)}
  .cart-h{padding:18px 16px 14px;gap:12px}
  .cart.open .cart-h .mob.btn{display:none}
  .cart.open{transform:none}
  .cart-h{cursor:pointer}
  .cart .handle{width:40px;height:4px;border-radius:2px;background:var(--line);position:absolute;top:7px;left:50%;margin-left:-20px}
}
@media (min-width:901px){.cart .handle,.cart .mob{display:none}}

/* ---------- Confirmation / reçu ---------- */
.confirm{max-width:440px;margin:20px auto;text-align:center}
.seal{width:96px;height:96px;margin:0 auto 18px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;background:var(--gold-wash)}
.seal svg{width:44px;height:44px;stroke:var(--gold-hi);stroke-width:1.8;fill:none}
@media (prefers-reduced-motion:no-preference){.seal{animation:seal .45s ease-out}@keyframes seal{from{transform:scale(.6);opacity:0}}}
.receipt{background:#fff;color:#111;border-radius:var(--r);padding:18px;text-align:left;font-size:14px;margin:18px 0}
.receipt h3{color:#111;text-align:center}
.receipt table{width:100%;border-collapse:collapse}
.receipt td{padding:3px 0}
.receipt .tot td{border-top:1px dashed #999;padding-top:8px;font-weight:700}

/* ---------- Listes / tableaux ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line-soft);border-radius:var(--r)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{position:sticky;top:0;background:var(--surface-2);color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;white-space:nowrap;font-size:13px}
table.t td{padding:10px 12px;border-top:1px solid var(--line-soft);vertical-align:top}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--surface-2)}
table.t td.num,table.t th.num{text-align:right;white-space:nowrap}
table.t tfoot td{font-weight:700;background:var(--surface-2)}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.ok{border-color:#2f5536;color:var(--ok)} .tag.bad{border-color:#5a2a22;color:var(--bad)} .tag.warn{border-color:#5b4413;color:var(--warn)} .tag.gold{border-color:var(--gold-lo);color:var(--gold-hi)}
.list>div{display:flex;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--line-soft)}
.list>div:first-child{border-top:0}
.hrow{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line-soft);cursor:pointer}
.hrow:first-child{border-top:0}
.hrow:hover{background:var(--surface-2)}
.hrow .tm{font-weight:600;min-width:46px}
.hrow .it{color:var(--muted);font-size:13px;margin-top:2px}

/* ---------- Administration ---------- */
.admin{display:grid;grid-template-columns:230px 1fr;gap:22px;align-items:start}
.side{position:sticky;top:80px}
.side a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500}
.side a:hover{color:var(--ivory);background:var(--surface)}
.side a.on{color:var(--gold-hi);background:var(--gold-wash)}
.side .grp{font-size:12px;color:var(--faint);padding:14px 12px 4px}
@media (max-width:960px){
  .admin{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:50;background:var(--black);border-right:1px solid var(--line);padding:calc(16px + var(--safe-t)) 10px 20px;overflow:auto;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none}
}
@media (min-width:961px){.menu-btn{display:none!important}}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:45}
.page-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-h h1{flex:1;min-width:200px;font-size:26px}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.filters .input{min-height:42px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:16px;border-radius:var(--r-lg);border:1px solid var(--line-soft);background:var(--surface)}
.kpi .v{font-family:var(--display);font-size:26px;line-height:1.15;margin-top:6px;color:var(--ivory)}
.kpi.lead{grid-column:span 2;border-color:var(--gold-lo);background:linear-gradient(160deg, rgba(201,162,39,.14), transparent 60%), var(--surface)}
.kpi.lead .v{font-size:40px;color:var(--gold-hi)}
@media (max-width:520px){.kpi.lead{grid-column:span 1}}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .d{font-size:12px;margin-top:4px}
.charts{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.charts .wide{grid-column:1/-1}
@media (max-width:960px){.charts{grid-template-columns:1fr}}
.chart-box{position:relative;height:260px}
.bars>div{margin:10px 0}
.bars .bar{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden;margin-top:5px}
.bars .bar i{display:block;height:100%;background:var(--gold)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{padding:10px 14px;border:0;background:transparent;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--gold-hi);border-bottom-color:var(--gold)}

/* ---------- Fenêtres modales ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:60;display:grid;place-items:center;padding:16px}
.modal{width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.modal.wide{max-width:820px}
.modal-h{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.modal-h h2{flex:1}
.modal-f{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
@media (max-width:640px){
  .modal-bg{place-items:end stretch;padding:0}
  .modal{max-width:none;border-radius:var(--r-lg) var(--r-lg) 0 0;max-height:92vh;padding-bottom:calc(20px + var(--safe-b));border-bottom:0}
  .modal-f .btn{flex:1}
  .modal-f .btn.primary{flex:2}
}

/* ---------- Notifications ---------- */
.toasts{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{padding:12px 16px;border-radius:var(--r);background:var(--surface-3);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:14px}
.toast.ok{border-color:#2f5536} .toast.bad{border-color:#5a2a22}
.spin{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:flex;justify-content:center;padding:50px}

/* ---------- Impression ---------- */
@media print{
  body{background:#fff;color:#000}
  .top,.side,.no-print,.toasts,.cart,.modal-bg .modal-f{display:none!important}
  main{padding:0;max-width:none}
  .print-area{display:block!important}
  .card,.kpi,.tbl-wrap{border-color:#ccc;background:#fff;color:#000}
  table.t th{background:#eee;color:#000} table.t td{color:#000;border-color:#ddd}
  .receipt{margin:0;padding:0}
  .modal-bg{position:static;background:none;display:block}
  .modal{border:0;max-height:none;background:#fff;color:#000}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"><div class="loading"><span class="spin"></span></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="config.js"></script>
<script src="js/core.js"></script>
<script src="js/pos.js"></script>
<script src="js/admin.js"></script>
<script src="js/main.js"></script>
</body>
</html>
